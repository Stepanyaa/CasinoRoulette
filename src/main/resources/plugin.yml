name: CasinoRoulette
version: '1.3.0'
main: ru.stepanyaa.casinoRoulette.CasinoRoulette
api-version: 1.16
softdepend: [Vault, PlaceholderAPI, PlayerPoints]
folia-supported: true

commands:
  casino:
    description: Main casino menu
    usage: /casino [reload|top|leaderboard|stats|wheel|daily]
  dailywheel:
    description: Daily fortune wheel
    usage: /dailywheel

permissions:
  casino.reload:
    description: Reload plugin configuration
    default: op

  # VIP / Limit permissions
  casino.limit.vip:
    description: Increased betting position limit (10)
    default: false

  casino.limit.admin:
    description: Maximum betting position limit (25)
    default: false

  # Update notifications
  casino.update.notify:
    description: Receive update notifications
    default: op

  # Admin permissions
  casino.admin:
    description: Full administrative access
    default: op
    children:
      casino.reload: true
      casino.update.notify: true
      casino.limit.admin: true
  casino.leaderboard:
    description: Access leaderboard
    default: true
  casino.stats:
    description: View casino stats
    default: true
  casino.wheel:
    description: Play fortune wheel
    default: true
  casino.dailywheel:
    description: Use daily wheel
    default: true

  casino.placeholders:
    description: PlaceholderAPI support
    default: true
